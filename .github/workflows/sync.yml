name: Sync LeetCode

on:
  workflow_dispatch: # Allows you to trigger it manually anytime
  schedule:
    - cron: "0 23 * * *" # Runs automatically once a day

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync LeetCode Submissions
        uses: alvations/leetcode-sync@master # Or another active fork containing the null safety fix
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          verbose: true
          commit-header: "[LeetCode Sync]"
